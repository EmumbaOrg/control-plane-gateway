# Model-picker shim: readable labels for the Claude-shaped gateway aliases.
#
# WHAT THE APP DOES. The Claude Code desktop app builds its picker from
# GET /v1/models on the gateway and applies the same Anthropic-name check
# TWICE — once filtering discovery, and again in jkt() when the picker list is
# built (`uo('gateway', id) -> vge(id) -> lo(id)`). Read out of
# Claude.app/Contents/Resources/app.asar, 27 Aug 2026:
#
#   DENY  = /…|deepseek|gemini|glm|gpt|grok|llama|mistral|nemotron|openai|
#            qwen|codex|kimi|moonshot|…/            <- hard veto, checked FIRST
#   ALLOW = ['claude','sonnet','opus','haiku','fable','mythos','anthropic']
#   lo(id) = DENY.test(id) ? false : ALLOW.some(w => id.includes(w))
#
# So the model ID ITSELF must pass `lo()`. That is why config.yaml carries
# vendor-free Claude-shaped aliases (claude-haiku-4-5-gmn-37-flash and friends)
# rather than honest ones.
#
# DELIBERATELY NOT INJECTING `anthropic_family_tier`. An earlier version of
# this file did. It gets a model past discovery but never into the picker —
# its real job is pinning what the bare `sonnet`/`opus` aliases resolve to
# (shortnameIdentityOverrides()), and injecting it here would silently hijack
# those aliases away from the real Anthropic models. Don't add it back.
#
# WHAT THIS FILE DOES. The app labels each picker row `display_name || id`, and
# LiteLLM sets display_name to the id. Left alone the picker would read
# "claude-haiku-4-5-gmn-37-flash". These rules rewrite the label only — the id
# on the wire is untouched, so routing, spend logs and capture are unaffected.
#
# Point the desktop app at http://localhost:4001. Port 4000 is unchanged, so
# the CLI, claude-gw.sh and every curl in the docs keep working as before.

events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # No client body limit: Claude Code sends large prompts.
  client_max_body_size 0;

  upstream litellm { server litellm:4000; }

  server {
    listen 4001;

    # -- the one rewritten response ------------------------------------------
    # `location =` still matches with a query string, so the app's real
    # request (/v1/models?limit=1000) lands here.
    #
    # Each rule anchors on the quote immediately after `"display_name":`, so a
    # short id cannot also match a longer one that contains it.
    location = /v1/models {
      proxy_pass http://litellm;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Load-bearing: sub_filter cannot rewrite a gzipped body. Asking upstream
      # for identity encoding is what makes the rewrite possible at all.
      proxy_set_header Accept-Encoding "";

      sub_filter_types application/json;
      sub_filter_once off;

      sub_filter '"display_name":"claude-haiku-4-5-gmn-37-flash"'   '"display_name":"Gemini 3.7 Flash (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-dsk-v4-pro"'    '"display_name":"DeepSeek V4 Pro (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-zai-53"'        '"display_name":"GLM-5.3 (gateway)"';
      sub_filter '"display_name":"claude-haiku-4-5-nvda-free"'      '"display_name":"Nemotron 3.5 Lightning free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-groq-oss-120b"' '"display_name":"Groq gpt-oss-120b (gateway)"';
      sub_filter '"display_name":"claude-haiku-4-5-groq-oss-20b"'   '"display_name":"Groq gpt-oss-20b (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-mmx-m3-free"'            '"display_name":"MiniMax M3 free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-zai-52-free"'            '"display_name":"GLM-5.2 free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-nvda-super-120b-free"'   '"display_name":"Nemotron 3 Super 120B free (gateway)"';
      sub_filter '"display_name":"claude-haiku-4-5-north-mini-code-free"'    '"display_name":"North Mini Code free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-dots3-note-free"'  '"display_name":"DOTS-3 Note free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-nvda-ultra-550b-free"'  '"display_name":"Nemotron 3 Ultra 550B free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-mmx-m27-free"'  '"display_name":"MiniMax M2.7 free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-tm-inkling-small-free"'  '"display_name":"Inkling Small free (gateway)"';
      sub_filter '"display_name":"claude-sonnet-4-5-goog-g4-31b-free"'  '"display_name":"Gemma 4 31B free (gateway)"';
    }

    # -- everything else, untouched ------------------------------------------
    # proxy_buffering off is load-bearing for /v1/messages: without it nginx
    # holds SSE chunks and the response arrives as one late blob.
    location / {
      proxy_pass http://litellm;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
