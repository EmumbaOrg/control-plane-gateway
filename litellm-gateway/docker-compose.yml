services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    # Publish to the host so a GUI client (TablePlus/DBeaver/psql) can connect at
    # localhost:5432. Local PoC only — a real deployment keeps the DB private.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 12

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      # Read from your shell. Export both before `docker compose up`.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?export ANTHROPIC_API_KEY first}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?export LITELLM_MASTER_KEY first}
      # Non-Anthropic models (see ../docs/NON-ANTHROPIC-MODELS.md). `:-` not `:?` on
      # purpose: this is optional, so anyone running the Anthropic-only setup
      # is unaffected by its absence.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # OpenAI — FIRST PARTY, unlike the gpt-oss routes which are OpenAI's
      # open-weight models served by Groq. `:-` not `:?` on purpose, same as
      # the two above: optional, so an Anthropic-only setup still boots.
      # ⚠ This account is on limited credit — see config.yaml's OpenAI section.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # z.ai — first party. LiteLLM has a native `zai` provider pointing at
      # https://api.z.ai/api/paas/v4, so the gateway talks to z.ai itself.
      # The Flash models are free on z.ai's own price list (not expiring
      # trial credit), so this needs an account but no card.
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # Local models via Ollama on the host. No key — Ollama does not
      # authenticate. host.docker.internal, not localhost: localhost inside
      # this container is the container. Ollama must also be listening on
      # 0.0.0.0 (OLLAMA_HOST=0.0.0.0), or the host gateway cannot reach it.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
      CAPTURE_DIR: /app/capture
      # Dump the first N raw callback payloads so we can see exactly what
      # LiteLLM hands us. This is how we answer "is the full body captured?"
      CAPTURE_KWARGS_DUMPS: "5"
      # INFO, not DEBUG: DEBUG logs full request/response bodies (slow, and a
      # second copy of prompts in the container logs). Switch back to DEBUG only
      # while actively debugging the gateway itself.
      LITELLM_LOG: INFO
      # Single-worker PoC: budgets are enforced correctly against one in-memory
      # counter, so the "no Redis" banner is informational here. Add Redis before
      # running multiple workers or trusting budget caps in production.
      LITELLM_DISABLE_NO_REDIS_WARNING: "true"
      # --- Request modification (action item 03) ------------------------------
      # Server-side output ceiling, applied in custom_capture.py's pre-call hook.
      # Claude Code reserves 32000 output tokens on every request and providers
      # gate on the reservation, so low-balance accounts 402 on traffic that
      # would have used 60 tokens. The CLI can set CLAUDE_CODE_MAX_OUTPUT_TOKENS;
      # the desktop app cannot, which is why this has to be server-side.
      # Set to 0 to disable.
      GATEWAY_MAX_OUTPUT_TOKENS: "${GATEWAY_MAX_OUTPUT_TOKENS:-8000}"
      # Models the clamp does NOT apply to. Anthropic honours 32000 happily, so
      # clamping there would truncate long answers for no reason. EXACT matches
      # only — `claude-haiku-4-5-gmn-37-flash` is a picker alias for Gemini and
      # would be wrongly exempted by prefix matching.
      GATEWAY_CLAMP_EXEMPT_MODELS: "${GATEWAY_CLAMP_EXEMPT_MODELS:-claude-opus-5,claude-sonnet-5,claude-haiku-4-5,claude-haiku-4-5-20251001}"
      # Outbound secret redaction. OFF by default: it rewrites developer content,
      # so enabling it should be a deliberate decision. See ../docs/GATEWAY-MODIFY.md.
      GATEWAY_REDACT: "${GATEWAY_REDACT:-off}"
      # Skill injection: off | installed | always. See ../docs/GATEWAY-MODIFY.md.
      #   installed (default) — only for developers who already have the plugin
      #     enabled. Fixes the measured failure (installed, offered, never
      #     called) without touching the prompts of people who never opted in.
      #   always — central enforcement in the strong sense. Also rewrites the
      #     prompts of non-adopters, including anyone doing client work under
      #     different standards. A deliberate decision with a named owner.
      GATEWAY_INJECT_SKILLS: "${GATEWAY_INJECT_SKILLS:-installed}"
      GATEWAY_SKILL_MANIFEST: /app/skills-inject.json
      # Empty means every model. Set to an exact-match list to narrow it — e.g.
      # to the translated routes only, if you trust native activation on
      # Anthropic and want the tokens back.
      GATEWAY_INJECT_SKILL_MODELS: "${GATEWAY_INJECT_SKILL_MODELS:-}"
      GATEWAY_INJECT_MAX_CHARS: "${GATEWAY_INJECT_MAX_CHARS:-20000}"
      # Content-based route override. Empty means the built-in policy: a
      # conversation naming Extreme Networks is served by the private local
      # model whatever the developer picked in the picker. `off` disables it.
      #
      # A rule is a policy statement about where a client's data may be
      # processed, so treat this like a permission list, not a tuning knob.
      # Keywords are matched as CASE-INSENSITIVE SUBSTRINGS with an optional
      # separator and NO word boundaries (widened 7 Sep 2026), so "extreme
      # network" also catches extremenetworks, extreme-network and
      # extremenetworksmigration — and "extreme network latency" too. A short
      # or common keyword therefore silently downgrades large amounts of
      # unrelated work to an 8B local model: keep each one a distinctive
      # multi-word name. Shape:
      #   [{"name":"...","model":"local-qwen3-8b","keywords":["acme corp"]}]
      GATEWAY_ROUTE_RULES: "${GATEWAY_ROUTE_RULES:-}"
      # How much conversation text is scanned for a trigger. Large on purpose —
      # Claude Code resends the whole history, and if the trigger phrase falls
      # outside this budget on a later turn the route flips back to the hosted
      # model mid-conversation. See ../docs/GATEWAY-MODIFY.md, behaviour 0.
      GATEWAY_ROUTE_SCAN_CHARS: "${GATEWAY_ROUTE_SCAN_CHARS:-2000000}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom_capture.py:/app/custom_capture.py:ro
      - ./capture:/app/capture
      # The injectable skills, mounted from the plugin the marketplace serves —
      # the same SKILL.md, not a copy, so the two delivery paths cannot drift.
      #
      # One directory per PLUGIN under /app/skills, because a single flat mount
      # can only ever serve one plugin: the second `:/app/skills` would shadow
      # the first and the skills it replaced would silently stop injecting.
      # Nesting also makes the manifest path mirror the skill's own namespaced
      # name — /app/skills/emumba-backend/rest-api-conventions/SKILL.md for
      # emumba-backend:rest-api-conventions — so a wrong path is visible on
      # sight. Adding a plugin is one more line here plus its manifest entries.
      - ./skills-inject.json:/app/skills-inject.json:ro
      - ../plugins/emumba-react/skills:/app/skills/emumba-react:ro
      - ../plugins/emumba-backend/skills:/app/skills/emumba-backend:ro
    command: ["--config", "/app/config.yaml"]

  # Model-picker shim for the Claude Code desktop app. Rewrites GET /v1/models
  # to add `anthropic_family_tier`, which is what gets the non-Anthropic models
  # past the app's discovery filter; every other route is proxied through
  # untouched. See picker-shim/nginx.conf for the filter rule it works around.
  #
  # Additive and optional: port 4000 is unchanged, so the CLI, claude-gw.sh and
  # every documented curl are unaffected. Only the desktop app points at 4001.
  picker-shim:
    image: nginx:1.27-alpine
    depends_on:
      - litellm
    ports:
      - "4001:4001"
    volumes:
      - ./picker-shim/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
