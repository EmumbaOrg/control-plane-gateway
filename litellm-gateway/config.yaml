# LiteLLM proxy config for the message-capture spike.
#
# VERIFY every key below against the LiteLLM docs for the image tag you pull —
# config key names have moved between releases:
#   https://docs.litellm.ai/docs/proxy/configs
#   https://docs.litellm.ai/docs/proxy/logging
#   https://docs.litellm.ai/docs/proxy/virtual_keys

model_list:
  - model_name: claude-opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Cheap model for smoke tests — run the fidelity checks against this,
  # not Opus, until you know the setup works.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # Pinned version IDs. Claude Code sometimes sends the bare alias
  # (claude-haiku-4-5) and sometimes a dated ID, depending on the release — real
  # captured traffic shows both — so any dated ID it may ask for must be listed
  # here too, or the request is refused before it reaches Anthropic.
  #
  # ONLY ADD IDS THAT ACTUALLY EXIST. Verified 21 Aug 2026: this one is live.
  # Two guessed IDs (claude-opus-5-20250805, claude-sonnet-5-20250514) were
  # removed after Anthropic returned `not_found_error` for both — a wrong dated
  # ID here fails at request time, which reads as "that model is broken".
  # Confirm a new ID with a real call before relying on it.
  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---------------------------------------------------------------------------
  # Non-Anthropic models, via OpenRouter. See ../docs/NON-ANTHROPIC-MODELS.md.
  #
  # These are ADDITIVE: nothing above changed, and if OPENROUTER_API_KEY is
  # unset the proxy still boots and the Anthropic routes still work — only a
  # call to one of these aliases fails. Existing virtual keys are unaffected
  # because a key's `models` list does not include them.
  #
  # Reaching these requires ANTHROPIC_BASE_URL=http://localhost:4000 (the
  # native /v1/messages route, "Candidate A" in README.md). The /anthropic
  # passthrough route CANNOT serve them — it forwards the body to Anthropic
  # unchanged, so there is no translation step.
  #
  # `drop_params: true` is set PER MODEL here, deliberately, and the global
  # `drop_params: false` below is left alone. Claude Code sends Anthropic-only
  # params (`output_config` is the known one, LiteLLM issue #22963) that
  # OpenAI-format providers reject with a hard 400. Dropping them is the
  # tradeoff that makes these routes work at all — and it is exactly the
  # silent-capability-loss risk the comment below warns about, which is why it
  # is confined to these five entries and never applied to Anthropic traffic.
  #
  # Model IDs verified against https://openrouter.ai/api/v1/models on
  # 25 Aug 2026; all five report `tools` support. OpenRouter retires IDs, so
  # re-check with `curl -s https://openrouter.ai/api/v1/models` before
  # blaming the gateway for a `not_found_error`.
  #
  # `model_info` costs are MANDATORY here, not decoration. None of these IDs
  # are in LiteLLM's built-in cost map (the proxy logs a `register_model`
  # warning for each on boot), and without explicit costs every call is
  # priced at $0 — spend logs read zero and `max_budget` on a virtual key
  # never trips. That would quietly disable the budget enforcement this whole
  # PoC exists to demonstrate, so it is the most important thing on these
  # entries. Prices are USD per token, from the OpenRouter catalogue on
  # 25 Aug 2026; re-check them when you re-check the IDs.
  # Cheapest of the set — use this one to prove the plumbing, the same way
  # claude-haiku-4-5 is used for the Anthropic side.
  - model_name: gemini-3.7-flash
    litellm_params:
      model: openrouter/google/gemini-3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.000000375
      output_cost_per_token: 0.000001875
      cache_read_input_token_cost: 0.0000000375
      cache_creation_input_token_cost: 0.0000000208

  - model_name: deepseek-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.000000579072
      output_cost_per_token: 0.000001158144
      cache_read_input_token_cost: 0.000000048256

  # Zero-cost route, for proving the plumbing on a free-tier OpenRouter
  # account. This exists because of a real failure: OpenRouter refuses a
  # free-tier request whose `max_tokens` exceeds the remaining credit, and
  # Claude Code asks for 32000, so every paid model above returns HTTP 402
  # until the account has credit. A `:free` model has no such gate.
  #
  # 1M context and a 65536 output ceiling, so it clears Claude Code's 32000 ask.
  # Costs are genuinely 0 — the explicit zeros are here so the entry is not
  # mistaken for a missing-cost bug like the one described above.
  #
  # Not every `:free` model works: `thinkingmachines/inkling:free` returns
  # 403 "only available on agentic harnesses", and `poolside/laguna-s-2.1:free`
  # rate-limits immediately. This one was picked by probing. Free capacity is
  # best-effort and can 429 or 502 at any time — fine for a smoke test, not
  # something to demo on.
  - model_name: nemotron-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # ---------------------------------------------------------------------------
  # Zero-cost OpenRouter routes. Added 27 Aug 2026 after the paid OpenAI routes
  # were removed: this account has no OpenRouter balance, and a paid route on a
  # near-zero balance fails with HTTP 402 before it reaches the provider
  # ("you requested up to 32000 tokens, but can only afford 2210"), which reads
  # as a broken model rather than an empty wallet.
  #
  # Selected from https://openrouter.ai/api/v1/models on 27 Aug 2026 by three
  # filters: prompt AND completion price of exactly 0, `tools` in
  # supported_parameters (Claude Code cannot run without tool calling), and an
  # output ceiling >= 16384 so a capped max_tokens still fits. 20 free models
  # were listed; 15 passed; these four are the largest of those.
  #
  # DELIBERATELY NOT INCLUDED, both previously tested and recorded above:
  # thinkingmachines/inkling:free (403, "only available on agentic harnesses")
  # and poolside/laguna-s-2.1:free (rate-limits immediately).
  #
  # Free capacity is best-effort and can 429 or 502 at any time. Fine for
  # proving the plumbing; do not demo on it. Explicit zero costs, so these are
  # not mistaken for the missing-cost bug described above — and note LiteLLM
  # logs "Skipping all budget checks for zero-cost model", so max_budget does
  # not constrain them at all.
  # 1M context, 943k output ceiling — the largest free route in the catalogue.
  - model_name: minimax-m3-free
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # 262k context, 235k output. Far larger than nemotron-free, which is too small for the harness.
  - model_name: nemotron-super-120b-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # Code-focused, 256k context, 64k output.
  - model_name: north-mini-code-free
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # 512k context, 460k output. Second-largest free route. Preview model — expect churn.
  - model_name: dots3-note-free
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # Largest free model by parameter count; 1M context, 65k output.
  - model_name: nemotron-ultra-550b-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # Previous-generation sibling of minimax-m3-free; useful as a fallback when M3 is capacity-limited.
  - model_name: minimax-m27-free
    litellm_params:
      model: openrouter/minimax/minimax-m2.7:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # UNTESTED. Its larger sibling thinkingmachines/inkling:free returns 403 "only available on agentic harnesses"; this one may do the same. Probe before relying on it.
  - model_name: inkling-small-free
    litellm_params:
      model: openrouter/thinkingmachines/inkling-small:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # Smallest of the set at 32k output, but a well-known open-weights model — a useful control when a larger free route misbehaves.
  - model_name: gemma-4-31b-free
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # ---------------------------------------------------------------------------
  # Groq. Added because the OpenRouter free tier could not fund Claude Code's
  # 32000-token max_tokens request, and the one free model that did work
  # (nemotron-free) is far too small for Claude Code's system prompt — it
  # answered "hi" by exploring the repo and reading .env. These are large
  # models on a usable free tier.
  #
  # No `model_info` block needed, unlike the OpenRouter entries: both IDs are
  # in LiteLLM's built-in cost map with correct prices, a 65536 output ceiling
  # and supports_function_calling=true. Verified in the running container's
  # model_prices_and_context_window_backup.json on 27 Aug 2026. Check
  # `GET /model/info` after any image change — if a price ever reads 0, pin it
  # explicitly the way the OpenRouter entries do, or budgets stop working.
  #
  # The 65536 output ceiling is the reason only these two are here. Groq also
  # serves qwen/qwen3.6-27b and qwen3.8-27b, but both cap output at 16384,
  # below what Claude Code asks for.
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # Smaller and faster, half the price. Use it for smoke tests.
  - model_name: groq-gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # ---------------------------------------------------------------------------
  # z.ai — FIRST PARTY. These entries talk to z.ai's own API with an Emumba
  # z.ai key: one account, one hop, one party seeing the prompt. z.ai is
  # reached this way and only this way; do not add an indirect route for it.
  #
  # ⚠ WHAT THIS COSTS TODAY: the z.ai account has NO BALANCE, so only the
  # free Flash tiers are reachable. Measured 4 Sep 2026 against the live key:
  #     zai/glm-4.5-flash   OK
  #     zai/glm-4.7-flash   OK
  #     zai/glm-5.3         RateLimitError "Insufficient balance or no
  #     zai/glm-5.2          resource package. Please recharge."
  # TO ADD A PAID MODEL, top up the z.ai account and register an entry with
  # `model: zai/glm-5.3`; it is already in LiteLLM's cost map at in 0.0000014
  # / out 0.0000044 with a 1M input ceiling. Do NOT register it before
  # funding: a route that answers every call with a 429 reads as a broken
  # gateway.
  #
  # PROVIDER. LiteLLM ships a native `zai` provider resolving to
  # https://api.z.ai/api/paas/v4 — no custom api_base needed. Verified in this
  # image: get_llm_provider('zai/glm-4.7-flash') -> ('glm-4.7-flash', 'zai',
  # None, 'https://api.z.ai/api/paas/v4').
  #
  # WHY THE FLASH TAG. Confirmed against this image's cost map on 3 Sep 2026:
  #     zai/glm-4.7-flash   cost 0/0     200k in / 128k out   tools True
  #     zai/glm-4.5-flash   cost 0/0     128k in /  32k out   tools True
  #     zai/glm-5.3-flash   cost NON-zero                     tools True
  # Only the first two are free, and `glm-4.7-flash` is the larger. BOTH are
  # registered below — 4.7-flash as the default and 4.5-flash as a second
  # free route, since these two are the only z.ai capacity this account has. Note `glm-5.3-flash` is NOT free despite
  # the Flash name — check the cost map before swapping the tag.
  #
  # Tool calling is non-negotiable (Claude Code cannot run without it) and the
  # 128k output ceiling clears the 32000 max_tokens the CLI asks for, so
  # neither of the two constraints that eliminated other candidates applies.
  #
  # FREE MEANS FREE, NOT TRIAL CREDIT — the Flash models are a line item
  # priced at nothing on z.ai's own list, so no card is required. The
  # documented free-tier rate limit is roughly 1 request/second, which is
  # fine for a demo and NOT enough for a room full of developers.
  #
  # COSTS ARE NOMINAL AND DELIBERATELY NON-ZERO, exactly as on the Ollama
  # routes below and for the same reason: LiteLLM logs "Skipping all budget
  # checks for zero-cost model", so a genuinely $0 route is exempt from
  # `max_budget` entirely and logs $0 spend. Pricing it at nothing would make
  # this the one route that escapes the enforcement this PoC exists to
  # demonstrate. These figures are invented; do not read them as money owed.
  #
  # REASONING-DISABLE: MEASURED, AND THE FLAG IS NOT THE FIX. GLM is a
  # reasoning model and spends its output budget on a thinking block before
  # any visible text — the same class of bug as qwen3's, but it does NOT have
  # the same cure. Measured with thinking:disabled ON, 5 runs per budget:
  #     max_tokens   64   0/5 produced any text (all 64 spent on thinking)
  #     max_tokens  256   5/5 produced text
  #     max_tokens 1024   5/5 produced text
  # So `thinking: disabled` REDUCES reasoning without removing it: the route
  # carrying the flag still failed every run at a tiny budget. THE EFFECTIVE
  # CONTROL IS THE OUTPUT BUDGET, NOT THE FLAG — roughly 256 tokens is the
  # floor. The flag is kept because it lowers the floor, not because it
  # eliminates the failure. Do not smoke-test this route at max_tokens 64 and
  # conclude it is broken.
  - model_name: zai-glm47-flash
    litellm_params:
      model: zai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      drop_params: true
      # LOAD-BEARING, same class of bug as `think: false` on the qwen3 route.
      # GLM-4.7-Flash is a reasoning model and will spend its whole output
      # budget on a `thinking` block before emitting any visible text.
      #
      # WHICH KNOB WORKS. Measured 3 Sep 2026 through /v1/messages,
      # max_tokens 64, prompt "Reply with exactly: OK":
      #   no thinking param        64 output tokens, text "", max_tokens
      #   reasoning_effort=none    64 output tokens, text "", max_tokens  <- INEFFECTIVE
      #   thinking type=disabled   text "OK", end_turn
      # `reasoning_effort` is NOT the knob for this provider. It is accepted
      # and silently does nothing, which is indistinguishable from a broken
      # model. Only the `thinking` shape below has any effect.
      #
      # ⚠ THIS REDUCES REASONING, IT DOES NOT ELIMINATE IT — unlike qwen3's
      # `think: false`, which removes the block outright. A `thinking` block
      # still comes back, so a MINIMUM OUTPUT BUDGET IS REQUIRED. Trial of 5
      # runs per budget, both aliases, same prompt:
      #   max_tokens   64:  0/5 produced any text  (all 64 tokens consumed)
      #   max_tokens  256:  5/5 produced text      (28-191 output tokens)
      #   max_tokens 1024:  5/5 produced text      (42-179 output tokens)
      # So ~256 is the floor for reliability. This is NOT a constraint in
      # practice: the gateway clamps Claude Code's 32000 ask to 8000, far
      # above the floor. It only bites on deliberately tiny probes — do not
      # smoke-test this route at max_tokens 64 and conclude it is broken.
      thinking:
        type: disabled
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_input_tokens: 200000
      max_output_tokens: 128000

  # Second free route. This account's only z.ai capacity is the free Flash
  # tier, and the documented limit is ~1 request/second — verified to bite in
  # practice: 4.7-flash returned "Rate limit reached for requests" while this
  # route answered normally in the same window.
  #
  # ⚠ THIS IS SPARE CAPACITY, NOT AUTOMATIC FAILOVER. No `fallbacks` are
  # configured, and LiteLLM says so in the error: "Available Model Group
  # Fallbacks=None". A caller pinned to one route gets a hard rate-limit
  # error and must switch by hand. Add `fallbacks` before more than one
  # person uses these routes at a time.
  #
  # SMALLER THAN 4.7-FLASH, DELIBERATELY SECOND CHOICE: 128k in / 32k out
  # against 200k / 128k. The 32k output ceiling still clears Claude Code's
  # 32000 ask, but only exactly — the gateway's clamp to 8000 is what keeps
  # this comfortable. Verified reachable on the live key 4 Sep 2026.
  # `thinking: disabled` for the same reason as the 4.7 entry above.
  - model_name: zai-glm45-flash
    litellm_params:
      model: zai/glm-4.5-flash
      api_key: os.environ/ZAI_API_KEY
      drop_params: true
      thinking:
        type: disabled
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_input_tokens: 128000
      max_output_tokens: 32000

  # ---------------------------------------------------------------------------
  # Local models, via Ollama on the developer's own machine. No API key, no
  # provider account, and no prompt leaves the laptop — the private-model
  # option. See ../docs/NON-ANTHROPIC-MODELS.md.
  #
  # `ollama_chat/`, NOT `ollama/`. The two are different providers in LiteLLM:
  # the plain one uses Ollama's legacy /api/generate completion route, which
  # has no tool-call support. Claude Code cannot run without tool calling, so
  # the chat provider is mandatory here, not a preference.
  #
  # NETWORKING. LiteLLM runs in a container and Ollama runs on the host, so the
  # api_base must be host.docker.internal, never localhost. Ollama also binds
  # 127.0.0.1 by default, which Docker Desktop's host gateway CANNOT reach —
  # the container gets connection refused. The host must run Ollama with
  # OLLAMA_HOST=0.0.0.0 for this to work at all. That is the single most likely
  # cause of a "local model is broken" report.
  #
  # CONTEXT WINDOW. `num_ctx` is load-bearing and set deliberately. Ollama
  # defaults to a 4096-token context and SILENTLY TRUNCATES anything longer —
  # no error, just a model that has not seen most of its own system prompt and
  # answers incoherently. Claude Code's system prompt alone is far past 4096.
  #
  # 32768 fits an 8B model on a 16 GB Mac ONLY IF the host quantises the KV
  # cache — at fp16 the cache alone is ~4.7 GB on top of ~5.2 GB of weights,
  # against a Metal working-set ceiling near 10.5 GB. Start Ollama with
  # OLLAMA_KV_CACHE_TYPE=q8_0 and the cache drops to ~2.4 GB. Without it,
  # expect a spill to CPU and a model that appears to hang rather than fail.
  # See ../docs/NON-ANTHROPIC-MODELS.md for the full arithmetic.
  #
  # COSTS ARE NOMINAL, AND THAT IS DELIBERATE. A local model costs nothing per
  # token, but LiteLLM logs "Skipping all budget checks for zero-cost model" and
  # a zero-cost route is exempt from `max_budget` entirely — so a key scoped to
  # local models would have no enforceable ceiling, and spend logs would read
  # zero for every call. The prices below are a stand-in for compute cost so
  # attribution and budgets keep working on this route like any other. They are
  # invented, not billed; do not read the spend figures as money owed.
  #
  # MODEL CHOICE. Must support tool calling (`ollama show <model>` lists
  # `tools` under Capabilities) or Claude Code cannot function. The default
  # below is sized for the 16 GB M1 Pro this was set up on; swap the tag for
  # whatever `ollama list` reports on the machine actually running it.
  # ⚠ `think: false` AND num_ctx 8192 ARE BOTH LOAD-BEARING, and this entry was
  # broken without them. Measured 3 Sep 2026 through /v1/messages, max_tokens 64,
  # prompt "Reply with exactly: OK":
  #     without think:false   9.3s, 64 output tokens ALL spent on a `thinking`
  #                           block, content[] text == "", stop_reason max_tokens
  #     with think:false      4.0s, 2 output tokens, text "OK", end_turn
  # The first case is not slow-but-correct, it is a route that returns NOTHING at
  # any output budget Claude Code would use for a short answer. See the picker
  # alias below for the same fix and the client-side half of the story.
  #
  # num_ctx 32768 IS A FLOOR HERE, NOT A LUXURY. 8192 was tried first (it is
  # cheaper and cuts prefill) and Claude Code refused to start on it: the CLI
  # returned "Prompt is too long" before the first turn, because its system
  # prompt plus tool definitions plus injected org skills already exceed 8k.
  # A local route that cannot seat Claude Code's own preamble is not usable at
  # all, so the window wins over the prefill saving.
  #
  # This costs memory and depends on a HOST setting nothing here can enforce:
  # at fp16 the KV cache alone is ~4.7 GB on top of ~5.2 GB of weights, against
  # a Metal working-set ceiling near 10.5 GB on the 16 GB M1 Pro this runs on.
  # Verified on this host 3 Sep 2026 — `ollama serve` carries
  # OLLAMA_KV_CACHE_TYPE=q8_0 and llama-server is launched with
  # `--cache-type-k q8_0 --cache-type-v q8_0 --flash-attn auto`, which brings
  # the cache to ~2.4 GB and fits. On a host WITHOUT that env var, expect a
  # spill to CPU that looks like a hang rather than an error.
  # KEEP IN SYNC with claude-gw.sh's DEFAULT_CTX for *local-* (32000).
  - model_name: local-qwen3-8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE
      drop_params: true
      num_ctx: 32768
      think: false
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      # DECLARE THE REAL WINDOW. Without these, GET /v1/models advertises
      # max_input_tokens 200000 / max_output_tokens 64000 for this route —
      # LiteLLM's generic defaults, not anything Ollama agreed to. The CLI is
      # protected by claude-gw.sh's CLAUDE_CODE_MAX_CONTEXT_TOKENS, but the
      # DESKTOP APP HAS NO SUCH ENV VAR: it reads this endpoint, believes 200k,
      # and builds prompts Ollama then truncates in silence. 32768 matches
      # num_ctx above; keep the three in step.
      max_input_tokens: 32768
      max_output_tokens: 8192

  # ---------------------------------------------------------------------------
  # Claude-shaped aliases, so the non-Anthropic models appear in the Claude
  # Code desktop app's model picker. See ../docs/NON-ANTHROPIC-MODELS.md.
  #
  # WHY RENAMING IS THE ONLY ROUTE. The app applies the same Anthropic-name
  # check TWICE — once when filtering /v1/models discovery, and again in
  # jkt() when it builds the picker list itself:
  #
  #   uo('gateway', id) -> vge(id) -> lo(id)
  #   lo(id) = DENY.test(id) ? false : ALLOW.some(w => id.includes(w))
  #
  # `anthropic_family_tier` gets a model past the FIRST check only. It never
  # gets a row into the picker — its actual job is pinning bare tier aliases
  # (`sonnet`, `opus`) to a model. So the id itself has to pass `lo()`.
  #
  # NAMING RULE, and this is the whole trick: DENY is a hard veto evaluated
  # FIRST, and it lists vendors — gemini, gpt, glm, deepseek, nemotron,
  # codex, openai, qwen, llama, grok, mistral, kimi and more. The previous
  # `claude-<tier>-via-<real model>` scheme named its vendor in every entry
  # and so vetoed all eight of its own aliases. These names carry the tier
  # and a VENDOR-FREE abbreviation instead: oai-52, gmn-37-flash, dsk-v4-pro,
  # zai-47f, nvda-free, groq-oss-120b. Each was checked against DENY
  # individually — note `dsk` avoids both `\bds-` and `dpsk`, and `oai`
  # avoids `openai`.
  #
  # The ids are cryptic on purpose; picker-shim/nginx.conf rewrites
  # `display_name` so the picker LABEL still reads "GPT-5.2 (gateway)".
  #
  # These are ADDITIVE. Every honest alias above still works, so claude-gw.sh,
  # existing virtual keys and every documented curl are unaffected. Prefer the
  # honest names for scripting; these exist for the picker.
  #
  # The tier in the name is a capability hint — Claude Code infers context
  # window and output ceiling from it — not a claim about the model. Audit
  # trails are unaffected: spend logs and capture record the UPSTREAM id
  # (openrouter/google/gemini-3.7-flash), not the alias.
  #
  # Costs are duplicated from the honest entries deliberately. Cost lookup
  # keys on litellm_params.model, but the OpenRouter ids are absent from
  # LiteLLM's cost map, so an alias without model_info prices at $0 and
  # max_budget stops tripping. The Groq pair needs none, same as above.
  #
  # AFTER ADDING ANY ALIAS HERE: add it to the virtual key's allowlist, add a
  # display_name rule to picker-shim/nginx.conf, and check the new name
  # against DENY — or it silently never reaches the picker.
  - model_name: claude-haiku-4-5-gmn-37-flash
    litellm_params:
      model: openrouter/google/gemini-3.7-flash
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.000000375
      output_cost_per_token: 0.000001875
      cache_read_input_token_cost: 0.0000000375
      cache_creation_input_token_cost: 0.0000000208

  - model_name: claude-sonnet-4-5-dsk-v4-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.000000579072
      output_cost_per_token: 0.000001158144
      cache_read_input_token_cost: 0.000000048256

  - model_name: claude-haiku-4-5-nvda-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: claude-sonnet-4-5-groq-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  - model_name: claude-haiku-4-5-groq-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      drop_params: true

  # Local Ollama route. NOTE THE NAME: `ollama` contains `llama`, which is on
  # the DENY list, so any alias with the provider's own name in it vetoes
  # itself and never reaches the picker. `local` is the vendor-free stand-in
  # and `q3` abbreviates the model. Costs duplicated from the honest entry
  # above for the reason given there.
  # THINK IS A TIME-TO-FIRST-TOKEN FIX, not a quality knob.
  # Symptom they solve: Claude Code sat on "hi, which model is running?" and
  # never rendered anything, while the gateway logged 200 OK from Ollama and
  # then "client disconnected before first chunk, upstream LLM request
  # cancelled". The request was fine; nothing had streamed yet when the client
  # gave up.
  #
  # qwen3:8b advertises `thinking` and emits its whole <think> block BEFORE any
  # visible content, so time-to-first-VISIBLE-token is prefill plus the entire
  # reasoning pass. `think: false` removes that block — measured 5.0s end to end
  # against Ollama directly at num_ctx 8192, versus a client timeout before the
  # first byte at 32768 with thinking on.
  #
  # num_ctx 32768, RAISED BACK FROM 8192. The smaller window was a deliberate
  # smoke-test value to cut prefill, and it is below what Claude Code actually
  # sends once system prompt, tool definitions and injected org skills are
  # counted — the CLI returns "Prompt is too long" and never starts a turn. See
  # the honest `local-qwen3-8b` entry above for the memory arithmetic and the
  # host setting (OLLAMA_KV_CACHE_TYPE=q8_0) that makes 32768 fit on 16 GB.
  # Ollama truncates silently past num_ctx, so keep claude-gw.sh's DEFAULT_CTX
  # for *local-* (32000) at or under this.
  - model_name: claude-sonnet-4-5-local-q3-8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE
      drop_params: true
      num_ctx: 32768
      think: false
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      # THIS IS THE ROUTE THAT NEEDS IT MOST — see the honest entry above.
      # This alias exists for the desktop app, and the desktop app has no
      # CLAUDE_CODE_MAX_CONTEXT_TOKENS to correct a wrong advertised window.
      max_input_tokens: 32768
      max_output_tokens: 8192

  # z.ai picker aliases. `glm` is on the app's DENY list, so the model id must
  # not spell it; `zai-47f` and `zai-45f` carry the vendor-free abbreviation.
  # Do not rename either to anything containing `glm` or it silently never
  # reaches the picker. Each needs a matching sub_filter line in
  # picker-shim/nginx.conf to get a readable label.
  - model_name: claude-sonnet-4-5-zai-47f
    litellm_params:
      model: zai/glm-4.7-flash
      api_key: os.environ/ZAI_API_KEY
      drop_params: true
      # See the honest `zai-glm47-flash` entry above for the measurements.
      # This alias needs it MORE, not less: it exists for the desktop app,
      # which has no way to send a thinking parameter of its own.
      thinking:
        type: disabled
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_input_tokens: 200000
      max_output_tokens: 128000

  - model_name: claude-sonnet-4-5-zai-45f
    litellm_params:
      model: zai/glm-4.5-flash
      api_key: os.environ/ZAI_API_KEY
      drop_params: true
      thinking:
        type: disabled
    model_info:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_input_tokens: 128000
      max_output_tokens: 32000

  - model_name: claude-sonnet-4-5-mmx-m3-free
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: claude-sonnet-4-5-nvda-super-120b-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: claude-haiku-4-5-north-mini-code-free
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
      drop_params: true
    model_info:
